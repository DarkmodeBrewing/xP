name: Go CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Toolchain
        run: go version
      - name: Verify dependencies
        run: go mod verify
      - name: Resolve module checksums
        run: go mod download golang.org/x/crypto
      - name: Upload resolved go.sum
        uses: actions/upload-artifact@v4
        with:
          name: resolved-go-sum
          path: go.sum
      - name: Unit tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Compile packages
        run: go build ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve module checksums
        run: go mod download golang.org/x/crypto
      - name: Race tests
        run: go test -race ./...

  vulnerabilities:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Resolve module checksums
        run: go mod download golang.org/x/crypto
      - name: Scan
        run: govulncheck ./...
